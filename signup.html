<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>SmartBracelet - Inscription</title>
</head>
<body>
    <div class="container">
        <div class="brand-section">
            <div class="logo"><i class="fas fa-user-plus" style="color: #667eea;"></i></div>
            <h1>Rejoignez-nous</h1>
            <p>Créez votre compte SmartBracelet<br>et commencez le suivi santé.</p>
        </div>

        <div class="login-section">
            <h2>Inscription</h2>
            <p class="subtitle">Complétez vos informations pour continuer</p>

            <div id="alert" class="alert"></div>

            <form id="signupForm">
                <div class="input-group">
                    <label>Nom complet</label>
                    <input type="text" id="fullname" placeholder="Ex: Ilef Bentorkia" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="exemple@smartbracelet.com" required>
                </div>

                <div class="input-group">
                    <label>Rôle</label>
                    <select id="role" required>
                        <option value="" disabled selected>Choisir un rôle</option>
                        <option value="admin">Administrateur</option>
                        <option value="employe">Employé</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn">Créer mon compte</button>

                <div class="register-link">
                    Déjà inscrit ? <a href="login.html">Se connecter</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => { alertDiv.style.display = 'none'; }, 3000);
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 1. Vérification des mots de passe
            if (password !== confirmPassword) {
                showAlert('Les mots de passe ne correspondent pas', 'error');
                return;
            }

            // 2. Vérification longueur mot de passe (optionnel mais recommandé)
            if (password.length < 6) {
                showAlert('Le mot de passe doit faire au moins 6 caractères', 'error');
                return;
            }

            // 3. Simulation de sauvegarde (dans un vrai projet, on enverrait ceci à une API/Firebase)
            console.log("Nouvel utilisateur :", { fullname, email, role, password });

            // 4. Succès et redirection
            showAlert('Compte créé avec succès ! Redirection vers la connexion...', 'success');
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>
</html>
