<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>SmartBracelet - Connexion</title>
    <style>
     
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .brand-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .brand-section h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .brand-section p {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 10px;
        }
        .features-list {
            margin-top: 30px;
            text-align: left;
        }
        .features-list li {
            list-style: none;
            margin: 15px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .features-list li::before {
            content: "✓";
            background: #00b894;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .login-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-section h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        .login-section .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .forgot-password {
            color: #667eea;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border-left: 4px solid #dc2626;
        }
        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border-left: 4px solid #16a34a;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .brand-section {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-section">
            <div class="logo"><i class="fas fa-heartbeat" style="color: #667eea;"></i></div>
            <h1>SmartBracelet</h1>
            <p>Surveillance Santé & Présence<br>Solution IoT intelligente</p>
            <ul class="features-list">
                <li>Présence automatisée</li>
                <li>Surveillance cardiaque</li>
                <li>Température corporelle</li>
                <li>Alertes en temps réel</li>
            </ul>
        </div>

        <div class="login-section">
            <h2>Connexion</h2>
            <p class="subtitle">Accédez à votre dashboard SmartBracelet</p>
            <div id="alert" class="alert"></div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email ou identifiant</label>
                    <input type="email" id="email" placeholder="exemple@smartbracelet.com" required>
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePassword()">👁️</span>
                    </div>
                </div>
                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> Se souvenir de moi
                    </label>
                    <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="login-btn">Se connecter</button>
                <div class="register-link">
                    Pas encore de compte ? <a href="signup.html">Créer un compte</a>
                </div>
            </form>
        </div>
    </div>

    <script>
     
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            if (!email || !password) {
                showAlert('Veuillez remplir tous les champs', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost/smart-bracelet-site/api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    const sessionData = {
                        email: data.email,
                        name: data.name,
                        role: data.role,
                        loggedIn: true
                    };
                    if (remember) {
                        localStorage.setItem('smartBraceletUser', JSON.stringify(sessionData));
                    } else {
                        sessionStorage.setItem('smartBraceletUser', JSON.stringify(sessionData));
                    }
                    showAlert(`Bienvenue ${data.name} ! Redirection...`, 'success');
                    setTimeout(() => {
                     
                        window.location.href = data.role === 'admin' ? 'adminpanel.html' : 'personnel.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Email ou mot de passe incorrect', 'error');
                    document.getElementById('password').value = '';
                }
            } catch (error) {
                console.error('Erreur réseau:', error);
                showAlert('Erreur de connexion au serveur', 'error');
            }
        });

       
        window.addEventListener('load', function() {
            const savedUser = localStorage.getItem('smartBraceletUser') || sessionStorage.getItem('smartBraceletUser');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                if (user.loggedIn) {
                    window.location.href = user.role === 'admin' ? 'adminpanel.html' : 'personnel.html';
                }
            }
        });
    </script>
</body>
</html>
