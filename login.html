<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css" type="text/css" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>SmartBracelet - Connexion</title>
    <script src="js/auth.js" defer></script>
</head>
<body>
    <div class="container">
       
        <div class="brand-section">
            <div class="logo"><i class="fas fa-heartbeat" style="color: #667eea;"></i></div>
            <h1>SmartBracelet</h1>
            <p>Surveillance Santé & Présence<br>Solution IoT intelligente</p>
            <ul class="features-list">
                <li>Présence automatisée</li>
                <li>Surveillance cardiaque</li>
                <li>Température corporelle</li>
                <li>Alertes en temps réel</li>
            </ul>
        </div>

  
        <div class="login-section">
            <h2>Connexion</h2>
            <p class="subtitle">Accédez à votre dashboard SmartBracelet</p>

            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email ou identifiant</label>
                    <input type="email" id="email" placeholder="exemple@smartbracelet.com" required>
                </div>

                <div class="input-group">
                    <label>Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePassword()">👁️</span>
                    </div>
                </div>

                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> Se souvenir de moi
                    </label>
                    <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="login-btn">Se connecter</button>

                <div class="register-link">
                    Pas encore de compte ? <a href="signup.html">Créer un compte</a>
                </div>
            </form>
        </div>
    </div>

    <script>
    // Configuration de l'API
    const API_URL = 'http://localhost:3001/api';

    // Fonction pour afficher les alertes
    function showAlert(message, type) {
        const alertDiv = document.getElementById('alert');
        alertDiv.textContent = message;
        alertDiv.className = `alert alert-${type}`;
        alertDiv.style.display = 'block';
        
        setTimeout(() => {
            alertDiv.style.display = 'none';
        }, 3000);
    }

    // Fonction pour basculer la visibilité du mot de passe
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.querySelector('.toggle-password');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = '👁️';
        }
    }

    // Gestionnaire de soumission du formulaire
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;
        
        if (!email || !password) {
            showAlert('Veuillez remplir tous les champs', 'error');
            return;
        }
        
        try {
            // Appel à votre API backend
            const response = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    mot_de_passe: password
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Préparation des données de session
                const sessionData = JSON.stringify({
                    id: data.employe.id,
                    email: data.employe.email,
                    name: `${data.employe.prenom} ${data.employe.nom}`,
                    role: data.employe.role,
                    token: data.token,
                    loggedIn: true
                });

                // Stockage selon l'option "Se souvenir de moi"
                if (remember) {
                    localStorage.setItem('smartBraceletUser', sessionData);
                    localStorage.setItem('authToken', data.token);
                } else {
                    sessionStorage.setItem('smartBraceletUser', sessionData);
                    sessionStorage.setItem('authToken', data.token);
                }
                
                showAlert(`Bienvenue ${data.employe.prenom} ! Redirection...`, 'success');
                
                // Redirection basée sur le rôle
                setTimeout(() => {
                    if (data.employe.role === 'admin') {
                        window.location.href = 'adminpanel.html';
                    } else {
                        window.location.href = 'personnel.html';
                    }
                }, 1500);
            } else {
                showAlert(data.message || 'Email ou mot de passe incorrect', 'error');
                document.getElementById('password').value = '';
            }
        } catch (error) {
            console.error('Erreur:', error);
            showAlert('Erreur de connexion au serveur. Vérifiez que le backend est démarré.', 'error');
        }
    });

    // Vérification de session au chargement
    window.addEventListener('load', function() {
        const savedUser = localStorage.getItem('smartBraceletUser') || sessionStorage.getItem('smartBraceletUser');
        if (savedUser) {
            const user = JSON.parse(savedUser);
            if (user.loggedIn) {
                // Redirection automatique selon le rôle
                if (user.role === 'admin') {
                    window.location.href = 'adminpanel.html';
                } else if (user.role === 'employe') {
                    window.location.href = 'personnel.html';
                }
            }
        }
    });
</script>
</body>
</html>
